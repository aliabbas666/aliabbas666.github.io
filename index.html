<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="My VPN Privacy Policy. Learn how My VPN handles information and protects your privacy."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <title>My VPN - Privacy Policy</title>

  <style>
    :root {
      --background: #080b12;
      --card: #101520;
      --card-light: #151b28;
      --primary: #4f7cff;
      --primary-light: #6f96ff;
      --text: #f5f7fb;
      --muted: #a7afbf;
      --border: rgba(255, 255, 255, 0.08);
      --success: #45d483;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          rgba(79, 124, 255, 0.15),
          transparent 35%
        ),
        var(--background);

      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: var(--primary-light);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
    }

    header {
      padding: 70px 0 50px;
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #111827;
      border: 2px solid var(--primary);

      box-shadow:
        0 0 40px rgba(79, 124, 255, 0.25);
    }

    .logo span {
      font-size: 36px;
    }

    header h1 {
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    header p {
      color: var(--muted);
      font-size: 16px;
    }

    .updated {
      display: inline-block;
      margin-top: 18px;
      padding: 7px 14px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--muted);
      font-size: 13px;
    }

    .intro {
      margin-bottom: 30px;
      padding: 28px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .intro strong {
      color: white;
    }

    main {
      padding-bottom: 70px;
    }

    section {
      margin-bottom: 30px;
      padding: 30px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    section h2 {
      margin-bottom: 16px;

      font-size: 22px;
      line-height: 1.3;
    }

    section h3 {
      margin: 22px 0 10px;
      font-size: 17px;
    }

    section p {
      margin-bottom: 14px;
      color: var(--muted);
    }

    section p:last-child {
      margin-bottom: 0;
    }

    ul {
      margin: 10px 0 16px 22px;
      color: var(--muted);
    }

    li {
      margin-bottom: 7px;
    }

    .highlight {
      padding: 18px 20px;
      margin: 18px 0;

      background: var(--card-light);
      border-left: 4px solid var(--primary);

      border-radius: 10px;
    }

    .highlight p {
      margin: 0;
    }

    .success {
      border-left-color: var(--success);
    }

    .
